spring.application.name=jira-lite

# H2 Database
spring.datasource.url=jdbc:h2:mem:jiralitedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (optional for debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=jira-lite-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256!
jwt.expiration-hours=24
